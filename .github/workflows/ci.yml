name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-zig
      # ReleaseFast + native CPU. The SHA-NI asm is comptime-gated on +sha, so this
      # compiles on any x86-64 runner and the hash falls back to std.crypto when the
      # runner lacks SHA-NI -- the KAT validates correctness either way.
      - name: Build (ReleaseFast, native)
        run: zig build -Doptimize=ReleaseFast -Dcpu=native
      - name: Unit and parity tests
        run: zig build test -Doptimize=ReleaseFast -Dcpu=native
      - name: Self-test (pow(a) KAT)
        shell: bash
        run: |
          BIN=zig-out/bin/zig-miner
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --selftest

  arm64-emulated:
    name: Build and KAT (linux-aarch64, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-zig
      # Cross-build a fully-static aarch64 musl binary and run its KAT under
      # qemu-user. The final SHA-256 runs on the ARMv8 crypto extensions via a
      # separate +sha2 object (src/sha256_hw_arm.zig) chosen by a runtime HWCAP
      # probe, so this job has to prove three separate things: the instructions
      # are in the binary, the runtime picked that path, and it is byte-correct.
      # NOTE: qemu execs the binary directly (kernel-load) -- it proves the binary runs,
      # but NOT Termux's system_linker_exec path (Android 10+ runs /system/bin/linker64
      # ./zig-miner), which is the real Android gate. We assert ET_DYN here so a PIE
      # regression (the "unexpected e_type: 2" Android failure) can't slip back in; the
      # on-device --selftest is the authoritative Termux check.
      - name: Cross-build aarch64 (static PIE) + KAT under QEMU
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl -p out-arm64
          BIN=out-arm64/bin/zig-miner
          readelf -h "$BIN" | grep -q 'Type:.*DYN' \
            || { echo 'ERROR: arm64 binary is not PIE (ET_DYN) -- Android/Termux will reject it'; \
                 readelf -h "$BIN" | grep -i type; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static llvm

          # The ARMv8 SHA instructions must actually be in the image. Use
          # llvm-objdump: the stock binutils objdump on an x86 runner cannot
          # decode aarch64 -- it prints nothing and exits 0, so a plain grep
          # reports "feature missing" and "wrong tool" identically. Require a
          # large decoded-instruction count first so a zero can be trusted.
          DECODED=$(llvm-objdump -d "$BIN" | grep -cE '^[[:space:]]+[0-9a-f]+:' || true)
          echo "decoded instructions: $DECODED"
          [ "$DECODED" -ge 5000 ] \
            || { echo "ERROR: disassembler decoded $DECODED instructions -- cannot trust a zero"; exit 1; }
          SHA_INSTRS=$(llvm-objdump -d "$BIN" | grep -cE 'sha256(h|h2|su0|su1)' || true)
          echo "ARMv8 SHA-256 instructions: $SHA_INSTRS"
          [ "$SHA_INSTRS" -ge 1 ] \
            || { echo 'ERROR: no ARMv8 SHA-256 instructions -- the +sha2 object did not link'; exit 1; }

          # KAT (hash1) + backend identity + hash2 differential (the mining path).
          qemu-aarch64-static "$BIN" --selftest | tee arm64-selftest.log
          grep -q 'pow(a): .* PASS' arm64-selftest.log
          grep -q 'sha backend: armv8-sha2' arm64-selftest.log \
            || { echo 'ERROR: runtime did not select the ARMv8 SHA path'; exit 1; }
          grep -q 'hash2 parity: PASS' arm64-selftest.log

          # The software fallback a crypto-less core would take must still be
          # correct -- qemu advertises SHA2 on every model, so force it.
          DERO_NO_ARM_SHA=1 qemu-aarch64-static "$BIN" --selftest | tee arm64-fallback.log
          grep -q 'sha backend: software' arm64-fallback.log
          grep -q 'pow(a): .* PASS' arm64-fallback.log
          grep -q 'hash2 parity: PASS' arm64-fallback.log

  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-zig
      - name: zig fmt --check
        run: zig fmt --check src build.zig
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Shell syntax and ShellCheck
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
            shellcheck --severity=error "$script"
          done < <(git ls-files -z '*.sh')
